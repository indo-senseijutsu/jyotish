標達成への執念。野心と集中力で、勝利の門をくぐるまで諦めない。`},{ja:`アヌラーダー`,deity:`ミトラ（友愛神）`,sym:`蓮の花`,desc:`友情、協調、献身。泥中の蓮のように、逆境の中で成功を咲かせる。`},{ja:`ジェーシュター`,deity:`インドラ`,sym:`耳飾り・傘`,desc:`年長者の権威。保護者としての責任感とプライドを持つ。`},{ja:`ムーラ`,deity:`ニルリティ（破壊女神）`,sym:`根の束`,desc:`根源への探求。破壊と再生を通じて、物事の根本を掘り下げる哲学性。`},{ja:`プールヴァ・アーシャーダー`,deity:`アパス（水神）`,sym:`扇・牙`,desc:`不屈の楽観と説得力。浄化の水のように、勝利への確信を持って進む。`},{ja:`ウッタラ・アーシャーダー`,deity:`ヴィシュヴェーデーヴァ`,sym:`象の牙`,desc:`普遍的勝利。高潔さと持続力で、揺るがない最終的な成功を得る。`},{ja:`シュラヴァナ`,deity:`ヴィシュヌ`,sym:`耳・三歩`,desc:`傾聴と学習。聞くことを通じて知識を受け継ぎ、伝える力。`},{ja:`ダニシュター`,deity:`ヴァス神群`,sym:`太鼓`,desc:`富とリズム感。音楽の才能と名声に恵まれ、豊かさを響かせる。`},{ja:`シャタビシャー`,deity:`ヴァルナ（水天）`,sym:`百の癒し手・円`,desc:`治癒と神秘。孤独を好み、秘密や隠された真理を探求する。`},{ja:`プールヴァ・バードラパダー`,deity:`アジャ・エーカパーダ`,sym:`寝台の前脚・二面`,desc:`激情と変容。理想主義と苦行の二面性を持ち、深い変化を求める。`},{ja:`ウッタラ・バードラパダー`,deity:`アヒルブドニヤ（深海の蛇）`,sym:`寝台の後脚`,desc:`深い知恵と忍耐。慈悲と内的安定を備えた、静かな賢者の宿。`},{ja:`レーヴァティー`,deity:`プーシャン（旅の守護神）`,sym:`魚・太鼓`,desc:`養育と旅の守護。優しさに満ち、完成と次への移行を司る最後の宿。`}],he=[{syl:[`チュ (Chu)`,`チェ (Che)`,`チョ (Cho)`,`ラ (La)`],desc:[`開拓者の勢い。大胆で衝動的、先駆的な行動力。エネルギーが最も強いパダ`,`実行力と実利。アイデアを着実に形にし、資質を財に結びつける`,`機敏な知性。コミュニケーション能力と機転、素早い学習力`,`癒し手の資質。共感力が高く、治療・奉仕・救助の才能を持つ`]},{syl:[`リ (Li)`,`ル (Lu)`,`レ (Le)`,`ロ (Lo)`],desc:[`創造的な意志力。堂々とした自己表現と誇り、リーダーシップ`,`勤勉と自制。奉仕と労働を通じて変容を遂げる。細部への注意力`,`調和と芸術性。人間関係の中で成長し、美と享楽を愛する`,`最も強烈な変容力。極端さと再生のエネルギー、深い情念`]},{syl:[`ア (A)`,`イ (I)`,`ウ (U)`,`エ (E)`],desc:[`理想への情熱。正義感と指導力、真理のために切り込む鋭さ`,`実務的な鋭さ。目標達成への集中力と現実的な判断力`,`改革精神。社会的視野と独創性、集団のための批判精神`,`直感的な浄化。繊細な感受性と精神的探求、内なる炎`]},{syl:[`オ (O)`,`ヴァ (Va)`,`ヴィ (Vi)`,`ヴ (Vu)`],desc:[`情熱的な創造。積極的に豊かさを追い、開拓する情熱を持つ`,`最も安定した豊穣。芸術・美・物質的成功の頂点`,`芸術と商才。豊かな表現力と社交性、機知に富む魅力`,`養育的な愛情。家庭・情緒・母性の豊かさ、深い情愛`]},{syl:[`ヴェ (Ve)`,`ヴォ (Vo)`,`カ (Ka)`,`キ (Ki)`],desc:[`創造的な探求。自信を持って理想を追い、注目を集める魅力`,`分析的な探求。知的識別力とユーモア、言葉の巧みさ`,`社交的な探求。芸術性とパートナーシップを通じた発見`,`深層への探求。鋭い洞察力を持つが、疑い深く用心深い`]},{syl:[`ク (Ku)`,`ガ (Gha)`,`ンガ (Nga)`,`チャ (Chha)`],desc:[`哲学的な嵐。真理探求への情熱、苦悩を知恵に変える力`,`野心と試練。困難な経験を通じて着実に成長する忍耐`,`科学的な知性。革新性と人道的関心、研究者の資質`,`感情の浄化。涙を経ての再生、深い共感と霊的感受性`]},{syl:[`ケ (Ke)`,`コ (Ko)`,`ハ (Ha)`,`ヒ (Hi)`],desc:[`冒険的な再出発。行動によって回復し、新天地を開く力`,`安定への回帰。物質面の再建と豊かさの回復`,`知的な柔軟性。学びを通じた更新、多才さ`,`母性的な帰還。家庭と精神的充足、心の安らぎへの回帰`]},{syl:[`フ (Hu)`,`ヘ (He)`,`ホ (Ho)`,`ダ (Da)`],desc:[`誇り高き養育。指導者・保護者としての繁栄と名声`,`実務的な奉仕。勤勉さと誠実さによる着実な成功`,`調和的な支援。協力関係と人望、社会的な信頼`,`深い献身。神秘的・宗教的傾向、精神性の探求`]},{syl:[`ディ (Di)`,`ドゥ (Du)`,`デ (De)`,`ド (Do)`],desc:[`哲学する蛇。知恵と楽観が混在し、説得力のある知性`,`戦略的な知性。野心的で抜け目なく、目的達成に長ける`,`秘密の知識。独創的な発想を持つが、策略的な面も`,`幻想と直感。霊的な感受性が高いが、惑わされやすい繊細さ`]},{syl:[`マ (Ma)`,`ミ (Mi)`,`ム (Mu)`,`メ (Me)`],desc:[`王者の意志。先祖の力を受け継ぐ指導力と権威`,`物質的な権威。地位・名誉・豊かさへの強い志向`,`知的な伝統。学識と弁舌、知識による権威の確立`,`家系への愛着。儀式・伝統・祖先崇拝への深い敬意`]},{syl:[`モ (Mo)`,`タ (Ta)`,`ティ (Ti)`,`トゥ (Tu)`],desc:[`華やかな自己表現。誇りと創造の喜び、芸能の才`,`勤勉な喜び。奉仕と実務を通じて楽しみを見出す`,`洗練された社交性。芸術と愛の調和、優雅な魅力`,`情熱的な愛。感情の深さと執着、強い官能性`]},{syl:[`テ (Te)`,`ト (To)`,`パ (Pa)`,`ピ (Pi)`],desc:[`高潔な援助。倫理観と寛大さ、正義に基づく支援`,`実務的な信頼。組織力と責任感、堅実な人望`,`社会奉仕の精神。友情と人道的貢献、広い人脈`,`慈悲深い支援。直感と自己犠牲、無私の援助`]},{syl:[`プ (Pu)`,`シャ (Sha)`,`ナ (Na)`,`タ (Tha)`],desc:[`素早い手技。行動的な器用さ、スポーツや技術の才`,`堅実な技能。工芸・手仕事と実利、粘り強い習熟`,`知的な巧みさ。商才と話術、交渉の上手さ`,`癒しの手。世話好きで直感的、治療やケアの才能`]},{syl:[`ペ (Pe)`,`ポ (Po)`,`ラ (Ra)`,`リ (Ri)`],desc:[`輝くカリスマ。自己演出の才と創造力、注目を集める力`,`精密な職人技。細部への美意識と完璧主義`,`洗練されたデザイン感覚。調和の美学、社交的魅力`,`神秘的な魅力。深みのある創造性、隠された情熱`]},{syl:[`ル (Ru)`,`レ (Re)`,`ロ (Ro)`,`タ (Ta)`],desc:[`自由な探求。学びと旅への渇望、独立した精神`,`実利的な独立。ビジネスの才覚、交渉と取引の上手さ`,`革新的な自由。独創性と社会性、風のような柔軟さ`,`柔軟な適応力。直感と霊性、流れに乗る知恵`]},{syl:[`ティ (Ti)`,`トゥ (Tu)`,`テ (Te)`,`ト (To)`],desc:[`猛烈な野心。競争心と突破力、目標への一直線の情熱`,`粘り強い達成。着実な目標追求、揺るがぬ決意`,`知略による勝利。多才さと説得力、戦略的思考`,`感情的な決意。守るべきもののために闘う執念`]},{syl:[`ナ (Na)`,`ニ (Ni)`,`ヌ (Nu)`,`ネ (Ne)`],desc:[`誇り高い献身。指導的な立場での友情と忠誠`,`謙虚な協力。実務を通じた信頼関係の構築`,`外交的な調和。人脈づくりと協調、バランス感覚`,`深い絆。神秘性と情の濃さ、霊的な友愛`]},{syl:[`ノ (No)`,`ヤ (Ya)`,`イ (Yi)`,`ユ (Yu)`],desc:[`寛大な長。正義感ある保護者、哲学的な権威`,`責任ある権威。組織の統率力と実務的な支配力`,`改革する年長者。独立心と鋭い洞察、進歩的視点`,`犠牲的な保護。霊的な深みと内面の苦悩、慈悲`]},{syl:[`イェ (Ye)`,`ヨ (Yo)`,`バ (Bha)`,`ビ (Bhi)`],desc:[`根源への突進。既存のものを壊して開拓する力`,`粘り強い探求。物質と精神の統合、着実な掘り下げ`,`知的な掘り下げ。研究心と探究心、根本原因の追究`,`感情の根を癒す。内面の深い変容、過去の解放`]},{syl:[`ブ (Bhu)`,`ダ (Dha)`,`ファ (Pha)`,`ダ (Dha)`],desc:[`誇り高い勝利。不屈の自信と楽観、輝く存在感`,`緻密な戦略。奉仕と自己浄化による勝利への道`,`説得の力。魅力と人望による成功、社交的影響力`,`情熱の深み。感情の力による変革、強い信念`]},{syl:[`ベ (Bhe)`,`ボ (Bho)`,`ジャ (Ja)`,`ジ (Ji)`],desc:[`高い理想。倫理的な勝利への志、普遍的正義`,`着実な野心。責任と実績の積み重ね、永続的成功`,`普遍的な貢献。社会改革の志、公共への奉仕`,`慈悲ある勝利。精神的な完成、揺るがぬ内的平和`]},{syl:[`ジュ (Ju/Khi)`,`ジェ (Je)`,`ジョ (Jo)`,`ガ (Gha/Kha)`],desc:[`積極的な学び。行動する知恵、率先して聞き伝える力`,`着実な知識の蓄積。実用的な学識と保存の才`,`伝達の才。言葉と情報を扱う達人、教育者の資質`,`共感的な傾聴。心を理解し養う力、深い思いやり`]},{syl:[`ガ (Ga)`,`ギ (Gi)`,`グ (Gu)`,`ゲ (Ge)`],desc:[`華やかな名声。音楽・リズムの才と自己表現力`,`技巧的な精密さ。勤勉さと細部へのこだわり`,`社交的な富。調和の感覚と芸術的才能、人脈による繁栄`,`深い野心。強い集中力と変容の力、粘り強い上昇志向`]},{syl:[`ゴ (Go)`,`サ (Sa)`,`スィ (Si)`,`ス (Su)`],desc:[`哲学的な治癒。真理と信念による癒しの力`,`実践的な医術。規律ある探求、体系的な治療の才`,`革新的な科学。独創的な発見と探求心`,`神秘的な直感。霊的な癒しの力、見えない世界への感受性`]},{syl:[`セ (Se)`,`ソ (So)`,`ダ (Da)`,`ディ (Di)`],desc:[`激しい理想。改革への情熱、燃えるような信念`,`現実的な理想主義。粘り強く社会を変える実行力`,`知的な二面性。深い思想と鋭い弁論、内面の葛藤`,`感情の深化。自己犠牲と共感、霊的な変容`]},{syl:[`ドゥ (Du)`,`タ (Tha)`,`ジャ (Jha)`,`ニャ (Na/Tra)`],desc:[`静かな威厳。内に秘めた力と寛容さ、落ち着いた指導力`,`献身的な知恵。細やかな奉仕と実務的な英知`,`調和的な英知。公平さと安定、争いを鎮める力`,`深遠な神秘。瞑想と変容の力、宇宙的な知恵`]},{syl:[`デ (De)`,`ド (Do)`,`チャ (Cha)`,`チ (Chi)`],desc:[`楽観的な導き。旅と学びの守護、明るい指導力`,`実務的な養育。責任感ある保護、堅実な支援`,`博愛的な支援。社会への貢献、広い慈しみ`,`完全なる慈悲。霊的完成と解脱、最終地点の優しさ`]}],ge={Su:{ja:`太陽`,sa:`Sūrya`,dv:`सूर्य`},Mo:{ja:`月`,sa:`Candra`,dv:`चन्द्र`},Ma:{ja:`火星`,sa:`Maṅgala`,dv:`मंगल`},Me:{ja:`水星`,sa:`Budha`,dv:`बुध`},Ju:{ja:`木星`,sa:`Guru`,dv:`गुरु`},Ve:{ja:`金星`,sa:`Śukra`,dv:`शुक्र`},Sa:{ja:`土星`,sa:`Śani`,dv:`शनि`},Ra:{ja:`ラーフ`,sa:`Rāhu`,dv:`राहु`},Ke:{ja:`ケートゥ`,sa:`Ketu`,dv:`केतु`}},_e={Ketu:{ja:`ケートゥ`,sa:`Ketu`},Venus:{ja:`金星`,sa:`Śukra`},Sun:{ja:`太陽`,sa:`Sūrya`},Moon:{ja:`月`,sa:`Candra`},Mars:{ja:`火星`,sa:`Maṅgala`},Rahu:{ja:`ラーフ`,sa:`Rāhu`},Jupiter:{ja:`木星`,sa:`Guru`},Saturn:{ja:`土星`,sa:`Śani`},Mercury:{ja:`水星`,sa:`Budha`}},ve=[{n:1,code:`D1`,sa:`Rāśi`,jp:`全体・自己`},{n:2,code:`D2`,sa:`Horā`,jp:`富・資産`},{n:3,code:`D3`,sa:`Drekkāṇa`,jp:`兄弟・勇気`},{n:4,code:`D4`,sa:`Chaturthāṃśa`,jp:`家・不動産`},{n:5,code:`D5`,sa:`Pañchāṃśa`,jp:`精神性・徳`,np:!0},{n:6,code:`D6`,sa:`Ṣaṣṭhāṃśa`,jp:`健康・負債`,np:!0},{n:7,code:`D7`,sa:`Saptāṃśa`,jp:`子供` .app{
  --ink:#e9f0f8; --ink2:#f3f7fc; --brass:#3f6bb0; --brass2:#1f4e8c; --saffron:#7ba428;
  --parch:#ffffff; --paperline:#2e4d7b; --ivory:#16233a; --mute:#4e6079;
  font-family:"Noto Sans JP",system-ui,sans-serif; color:var(--ivory);
  background:radial-gradient(1200px 500px at 70% -10%, #b9d2ee33, transparent 60%),
    radial-gradient(900px 400px at 0% 110%, #a9c8e833, transparent 60%), var(--ink);
  min-height:100%; padding:0 0 40px;
}
.app *{box-sizing:border-box}
.hero{position:relative; overflow:hidden; padding:38px 28px 30px; border-bottom:1px solid #3f6bb033;
  background:linear-gradient(180deg,#c3d8ef,#e9f0f8)}
.stars{position:absolute; inset:0; width:100%; height:100%; opacity:.7}
.heroInner{position:relative; max-width:1080px; margin:0 auto}
.eyebrow{font-family:"Cormorant Garamond",serif; letter-spacing:.32em; text-transform:uppercase; color:var(--brass2); font-size:13px; margin-bottom:6px}
.eyebrow{display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap}
.lastUpdate{font-size:11px; letter-spacing:.08em; text-transform:none; color:var(--mute); white-space:nowrap}
.hero h1{font-family:"Shippori Mincho",serif; font-weight:700; font-size:clamp(26px,4.5vw,40px); margin:0; letter-spacing:.04em; color:#152252; text-shadow:0 1px 0 #f4f8fd}
.titleRow{display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap}
.ghLink{font-family:"Cormorant Garamond",serif; letter-spacing:.12em; text-transform:uppercase; font-size:12px; white-space:nowrap; color:var(--brass2); text-decoration:none; border:1px solid #3f6bb055; border-radius:999px; padding:6px 14px; background:#ffffffaa; transition:background .15s,color .15s,border-color .15s}
.ghLink:hover{background:var(--brass2); color:#fff; border-color:var(--brass2)}
.sub{color:var(--mute); margin:10px 0 0; font-size:14px; max-width:660px}

.grid{max-width:1080px; margin:26px auto 0; padding:0 22px; display:grid; grid-template-columns:330px 1fr; gap:22px; align-items:start}
@media(max-width:880px){ .grid{grid-template-columns:1fr} }

.panel{background:linear-gradient(180deg,#f5f8fc,#e7eef8); border:1px solid #3f6bb02e; border-radius:14px; padding:20px;
  box-shadow:0 18px 40px -28px #000, inset 0 1px 0 #ffffff0a}
.ph{font-family:"Shippori Mincho",serif; font-size:16px; margin:0 0 14px; color:var(--brass2); letter-spacing:.06em}
.fl{display:flex; flex-direction:column; gap:6px; font-size:12.5px; color:var(--mute); margin-bottom:13px}
.fl.sm{font-size:11.5px}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:9px}
input,select,textarea{font-family:inherit; font-size:14px; color:var(--ivory); background:#eaf1f9; border:1px solid #3f6bb033; border-radius:8px; padding:9px 10px; width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brass); border-color:transparent}
select:disabled{opacity:.45; cursor:not-allowed}
select option,select optgroup{background:#eaf1f9; color:var(--ivory)}
.cta{margin-top:4px; width:100%; padding:12px; border:0; border-radius:9px; cursor:pointer;
  font-family:"Shippori Mincho",serif; font-weight:700; letter-spacing:.08em; font-size:15px;
  color:#16233a; background:linear-gradient(180deg,#a9c6e8,#82a9d9); box-shadow:0 8px 22px -10px #3f6bb088; transition:transform .08s}
.cta:hover{transform:translateY(-1px)}
.err{margin-top:10px; color:#a8341a; font-size:12.5px}
.hint{margin:13px 0 0; font-size:11px; line-height:1.6; color:#4e6079}

.rhead{display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:14px}
.rhead.divTop{margin-top:26px; padding-top:18px; border-top:1px dashed #3f6bb033}
[id^="sec-"]{scroll-margin-top:14px}
.navJump{display:flex; flex-direction:column; gap:7px; margin-top:16px; padding-top:14px; border-top:1px dashed #3f6bb033}
.navJumpTitle{font-size:11px; color:var(--brass2); letter-spacing:.06em; margin-bottom:2px; font-family:"Shippori Mincho",serif}
.navBtn{display:flex; justify-content:space-between; align-items:center; gap:8px; width:100%; font-family:inherit; font-size:12.5px; color:var(--brass2); background:#eaf1f9; border:1px solid #3f6bb02e; border-radius:8px; padding:9px 12px; cursor:pointer; text-align:left; transition:all .1s}
.navBtn:hover{border-color:var(--brass); background:#dfe9f6}
.navArrow{color:var(--brass); font-size:12px}
.rtitle{font-family:"Shippori Mincho",serif; font-size:18px; color:#16233a; letter-spacing:.04em}
.seg{display:flex; background:#eaf1f9; border:1px solid #3f6bb033; border-radius:9px; overflow:hidden}
.seg button{font-family:inherit; font-size:12px; color:var(--mute); background:transparent; border:0; padding:7px 12px; cursor:pointer; white-space:nowrap}
.seg button.on{color:#16233a; background:linear-gradient(180deg,#a9c6e8,#82a9d9); font-weight:700}

.vargaPick{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px}
.vbtn{font-family:"Cormorant Garamond",serif; font-weight:600; font-size:13px; color:var(--mute);
  background:#eaf1f9; border:1px solid #3f6bb02e; border-radius:7px; padding:6px 9px; cursor:pointer; min-width:38px; transition:all .1s}
.vbtn:hover{border-color:var(--brass)}
.vbtn.on{color:#16233a; background:linear-gradient(180deg,#a9c6e8,#82a9d9); border-color:transparent; font-weight:700}
.vargaName{font-family:"Shippori Mincho",serif; font-size:14px; color:#16233a; margin-bottom:16px}
.vcode{font-family:"Cormorant Garamond",serif; color:var(--brass2); font-weight:600; margin-right:5px}
.vmean{color:var(--mute); font-size:12.5px}
.vnp{display:inline-block; margin-left:8px; font-size:10px; color:var(--saffron); border:1px solid #7ba42855; border-radius:5px; padding:1px 6px; vertical-align:middle}

.chartWrap{max-width:430px; margin:0 auto 22px}
.kundli{width:100%; height:auto; display:block; filter:drop-shadow(0 16px 30px #00000066)}
.paper{fill:var(--parch)}
.kundli .ink line,.kundli .ink polygon{stroke:var(--paperline); stroke-width:1.6; fill:none}
.kundli .ink rect{stroke:var(--paperline); stroke-width:3}
.rnum{fill:#152252; font-size:13px; font-family:"Cormorant Garamond",serif; font-weight:600}
.lagnaTag{fill:var(--saffron); font-size:8px; letter-spacing:.1em}
.pl{font-size:11px; font-family:"Cormorant Garamond",serif; font-weight:600}

.nakTitle{font-family:"Shippori Mincho",serif; font-size:15px; color:var(--brass2); letter-spacing:.06em; margin:26px 0 12px; padding-top:18px; border-top:1px dashed #3f6bb033}
.nakring{filter:drop-shadow(0 16px 30px #00000044)}
.paper2{fill:var(--parch)}
.ringLine{fill:none; stroke:var(--paperline); stroke-width:1.2; opacity:.5}
.ringLine.bold{stroke-width:1.8; opacity:.8}
.nakLine{stroke:var(--paperline); stroke-width:.8; opacity:.4}
.signLine{stroke:var(--brass2); stroke-width:1.4; opacity:.6}
.nakOcc{fill:#7ba42826; stroke:none}
.nakLbl{font-family:"Cormorant Garamond",serif; font-size:9.5px; fill:#1f4e8c; letter-spacing:.02em}
.nakLbl.on{fill:#4a5e14; font-weight:700}
.signLbl{font-family:"Shippori Mincho",serif; font-size:11px; fill:#233240}
.lagnaLine{stroke:var(--saffron); stroke-width:1.4; stroke-dasharray:5 4}
.lagnaTag2{font-size:10px; fill:var(--saffron); font-weight:700; font-family:"Cormorant Garamond",serif}
.pTick{stroke:#233240; stroke-width:1.6}
.pLead{stroke:#23324033; stroke-width:.8}
.scell{fill:none; stroke:var(--paperline); stroke-width:1.4}
.scenter{fill:#00000008; stroke:var(--paperline); stroke-width:1.4}
.scellsign{fill:#152252; font-size:11px; font-family:"Shippori Mincho",serif}
.lagnaWedge{fill:var(--saffron); opacity:.85}
.centerlbl{fill:#152252; font-size:22px; font-family:"Cormorant Garamond",serif; font-weight:600}
.centersub{fill:#152252; font-size:12px; font-family:"Cormorant Garamond",serif; letter-spacing:.1em}

.cards{display:grid; grid-template-columns:repeat(4,1fr); gap:11px; margin-bottom:20px}
@media(max-width:620px){ .cards{grid-template-columns:1fr 1fr} }
.card{background:#f0f5fb; border:1px solid #3f6bb026; border-radius:11px; padding:12px 13px}
.cl{font-size:10.5px; color:var(--brass2); letter-spacing:.04em; margin-bottom:7px}
.cm{font-family:"Shippori Mincho",serif; font-size:17px; color:#16233a; line-height:1.2}
.cs{font-size:11px; color:var(--mute); margin-top:4px; font-family:"Cormorant Garamond",serif}

.tbl{width:100%; border-collapse:collapse; font-size:12.5px}
.tbl th{text-align:left; font-weight:500; color:var(--brass2); font-size:11px; letter-spacing:.04em; padding:8px; border-bottom:1px solid #3f6bb040}
.tbl td{padding:9px 8px; border-bottom:1px solid #00000012; color:var(--ivory)}
.tbl tr:hover td{background:#0000000d}
.lagnaRow td{background:#7ba42812; border-top:1px solid #3f6bb040}
.dv{font-family:"Noto Serif Devanagari",serif; color:var(--brass2); margin-right:2px}
.mono{font-variant-numeric:tabular-nums; font-family:"Cormorant Garamond",serif; font-size:14px}
.mono.small{font-size:12px}
